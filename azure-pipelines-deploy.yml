trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: provision
    displayName: Provision infrastructure (Bicep)
    jobs:
      - job: bicep
        displayName: "Deploy infra/main.bicep to Azure"
        steps:
          - task: AzureCLI@2
            displayName: az deployment group create
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az group create \
                  --name $(AZURE_RESOURCE_GROUP) \
                  --location eastus2 \
                  --output none

                token=$(az deployment group create \
                  --resource-group $(AZURE_RESOURCE_GROUP) \
                  --template-file infra/main.bicep \
                  --parameters infra/main.bicepparam \
                  --name internetmatt-web \
                  --query "properties.outputs.deploymentToken.value" \
                  --output tsv)

                echo "##vso[task.setvariable variable=deploymentToken;isOutput=true;issecret=true]$token"

  - stage: build_and_deploy
    displayName: Build & Deploy to Azure Static Web Apps
    dependsOn: provision
    variables:
      deploymentToken: $[ stageDependencies.provision.bicep.outputs['deploymentToken'] ]
    jobs:
      - job: deploy
        displayName: "Build Astro site and deploy"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
            displayName: Use Node 20
          - script: npm ci
            displayName: Install dependencies
          - script: npm run build
            displayName: Build Astro site
          - task: AzureStaticWebApp@0
            displayName: Deploy to Azure Static Web Apps
            inputs:
              app_location: "/"
              output_location: "dist"
              azure_static_web_apps_api_token: $(deploymentToken)

  - stage: lighthouse
    displayName: Lighthouse audit
    dependsOn: build_and_deploy
    jobs:
      - job: lighthouse
        displayName: "Run Lighthouse CI"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
            displayName: Use Node 20
          - script: npm ci
            displayName: Install dependencies
          - script: npm run build
            displayName: Build site
          - script: npm run lhci
            displayName: Run Lighthouse CI
            env:
              LHCI_GITHUB_APP_TOKEN: $(LHCI_GITHUB_APP_TOKEN)
