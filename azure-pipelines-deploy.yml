trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: build_and_deploy
    displayName: Build & Deploy to Azure Static Web Apps
    jobs:
      - job: deploy
        displayName: "Build Astro site and deploy"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
            displayName: Use Node 20
          - script: npm ci
            displayName: Install dependencies
          - script: npm run build
            displayName: Build Astro site
          - task: AzureStaticWebApp@0
            displayName: Deploy to Azure Static Web Apps
            inputs:
              app_location: "/"
              output_location: "dist"
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)

  - stage: lighthouse
    displayName: Lighthouse audit
    dependsOn: build_and_deploy
    jobs:
      - job: lighthouse
        displayName: "Run Lighthouse CI"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
            displayName: Use Node 20
          - script: npm ci
            displayName: Install dependencies
          - script: npm run build
            displayName: Build site
          - script: npm run lhci
            displayName: Run Lighthouse CI
            env:
              LHCI_GITHUB_APP_TOKEN: $(LHCI_GITHUB_APP_TOKEN)
